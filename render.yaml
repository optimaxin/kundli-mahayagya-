# Render Blueprint for the backend API (Dashboard -> New -> Blueprint -> pick this repo).
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is created.
# They are never stored in this repository. See DEPLOY.md.
services:
  - type: web
    name: mahayagya-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Closest Render region to the Supabase database (ap-south-1, Mumbai).
    region: singapore
    # "free" sleeps after 15 min idle (first request then takes ~1 min). Use "starter" or higher
    # before registration opens and during the event.
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Supabase transaction pooler (IPv4). Render has no IPv6, so the direct db.<ref>.supabase.co host
      # cannot be used. Format:
      # postgresql://postgres.<project-ref>:<db-password>@aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DB_DISABLE_PREPARED_STATEMENTS
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: WEB_CONCURRENCY
        value: "2"
      # Login-token signing secret: generated by Render.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Fernet key (urlsafe base64, 32 bytes). Render's generator does not produce this format.
      # Create one: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # The Cloudflare Pages site, e.g. https://kundli-mahayagya.pages.dev (comma-separate several).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_HSTS
        value: "true"
      # Requests reach the app only through Render's proxy; trust its X-Forwarded-For for client IPs.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: ENABLE_DOCS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: REPORTS_DIR
        value: /app/var/reports
